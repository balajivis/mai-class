<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Blackboard · Replay</title>
<link rel="stylesheet" href="/style.css" />
<style>
.replay-grid { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 96px); padding: 14px; gap: 10px; }
.scrubber { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
.scrubber input[type=range] { width: 100%; }
.scrubber .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 6px; font-family: ui-monospace, monospace; }
.scrubber .controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.scrubber button { background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: 12px ui-sans-serif; }
.scrubber button:hover { background: var(--border-2); }
.feed-pane { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; overflow: auto; }
.feed-pane ol { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, monospace; font-size: 11.5px; }
.feed-pane li { display: grid; grid-template-columns: 70px 110px 90px 60px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
</style>
</head>
<body class="dark">

<header class="topbar">
  <div class="brand"><span class="logo">⌥</span><span class="title">Replay · <span id="proj-name">…</span></span></div>
  <div class="ctx"><a href="javascript:history.back()" style="color:var(--amber);text-decoration:none">← back</a></div>
</header>

<main class="replay-grid">
  <div class="scrubber">
    <input id="scrubber" type="range" min="0" max="100" value="100" step="1" />
    <div class="meta">
      <span id="m-start">—</span>
      <span id="m-cursor">—</span>
      <span id="m-end">—</span>
    </div>
    <div class="controls">
      <button id="btn-play">▶ Play</button>
      <button id="btn-pause">⏸ Pause</button>
      <span style="color:var(--text-3);font-size:11px">speed</span>
      <select id="speed" style="background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);padding:3px 6px;border-radius:4px">
        <option>1x</option><option>2x</option><option>4x</option><option>8x</option><option selected>16x</option>
      </select>
      <span id="event-count" style="color:var(--text-3);font-size:11px;margin-left:auto">0 events</span>
    </div>
  </div>

  <div class="feed-pane"><ol id="feed"></ol></div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const proj = location.pathname.split('/').slice(-2)[0]; // /projects/teamN/replay
  const token = params.get('token') || '';
  if (!token) {
    document.body.innerHTML = '<div style="padding:2rem;color:#fbbf24;font:14px ui-monospace">Provide ?token=… in URL.</div>';
    return;
  }

  let allEvents = [];
  let cursor = 0;
  let playing = false;
  let speed = 16;

  function fmt(ts) { return new Date(ts).toTimeString().slice(0,8); }
  function colour(name) {
    if (!name) return '#71717a';
    let h = 0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
    return `hsl(${h % 360} 70% 60%)`;
  }

  async function load() {
    const r = await fetch(`/api/p/${proj}/events?limit=1000`, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) { alert('auth/load fail'); return; }
    const data = await r.json();
    const sr = await fetch(`/api/p/${proj}/state`, { headers: { Authorization: 'Bearer ' + token } });
    if (sr.ok) $('proj-name').textContent = (await sr.json()).project?.name || proj;
    allEvents = (data.events || []).slice().reverse();
    $('event-count').textContent = `${allEvents.length} events`;
    if (allEvents.length === 0) return;
    const start = allEvents[0].ts, end = allEvents[allEvents.length-1].ts;
    $('m-start').textContent = fmt(start);
    $('m-end').textContent = fmt(end);
    $('scrubber').max = String(allEvents.length);
    cursor = allEvents.length;
    $('scrubber').value = String(cursor);
    render();
  }

  function render() {
    const feed = $('feed');
    feed.innerHTML = '';
    const visible = allEvents.slice(0, cursor).slice(-200).reverse();
    for (const ev of visible) {
      const li = document.createElement('li');
      const c = colour(ev.agent_name);
      li.innerHTML = `
        <span style="color:var(--text-3)">${fmt(ev.ts)}</span>
        <span style="color:${c}">${ev.agent_name || 'system'}</span>
        <span style="color:var(--text-2)">${ev.kind}</span>
        <span style="color:var(--purple)">${ev.performative || ''}</span>
        <span style="color:var(--text-3)">${typeof ev.payload === 'object' ? Object.entries(ev.payload).slice(0,2).map(([k,v]) => `${k}=${typeof v==='object'?JSON.stringify(v).slice(0,40):v}`).join(' · ') : ''}</span>`;
      feed.appendChild(li);
    }
    if (allEvents[cursor-1]) $('m-cursor').textContent = fmt(allEvents[cursor-1].ts);
  }

  $('scrubber').oninput = (e) => { cursor = Number(e.target.value); render(); };
  $('btn-play').onclick = () => {
    playing = true;
    (function tick() {
      if (!playing) return;
      if (cursor < allEvents.length) {
        cursor = Math.min(allEvents.length, cursor + Math.max(1, Math.floor(speed/4)));
        $('scrubber').value = String(cursor);
        render();
        setTimeout(tick, 60);
      } else playing = false;
    })();
  };
  $('btn-pause').onclick = () => { playing = false; };
  $('speed').onchange = (e) => { speed = Number(e.target.value.replace('x','')) || 16; };

  load();
})();
</script>
</body>
</html>
