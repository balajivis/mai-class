<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Blackboard · Team</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="dark">
<header class="topbar">
  <div class="brand">
    <span class="logo">⌥</span>
    <span class="title">Modern AI Pro · <em>Multiagents-v2</em></span>
  </div>
  <div class="ctx">
    <span id="proj-name" class="proj">…</span>
    <span class="dot"></span>
    <span id="mode-pill" class="mode">Mode A · Free-for-all</span>
    <span class="dot"></span>
    <span id="conn-pill" class="conn">connecting…</span>
  </div>
</header>

<main class="grid">

  <section class="panel agents">
    <h2>Agents <span id="agent-count" class="count">0</span></h2>
    <ul id="agents"></ul>
  </section>

  <section class="panel tasks">
    <h2>Tasks <span id="task-count" class="count">0</span></h2>
    <div class="task-bins">
      <div><h3>Open</h3><ul id="t-open"></ul></div>
      <div><h3>Claimed</h3><ul id="t-claimed"></ul></div>
      <div><h3>Done</h3><ul id="t-done"></ul></div>
      <div><h3>Failed</h3><ul id="t-failed"></ul></div>
    </div>
  </section>

  <section class="panel feed">
    <h2>Activity <span class="count" id="feed-rate">0/min</span></h2>
    <ol id="feed"></ol>
  </section>

</main>

<footer class="bottom">
  <span>Token-gated · self-organising · per-team blackboard</span>
  <span id="metric-tax">tax 0 ev/min</span>
  <span id="metric-conflicts">conflicts 0</span>
</footer>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const proj = params.get('proj') || location.pathname.split('/').pop().replace('.html','') || 'team1';
  const token = params.get('token') || '';
  if (!token) {
    document.body.innerHTML = '<div style="padding:2rem;color:#fbbf24;font:14px ui-monospace">Provide ?proj=teamN&token=… in URL.</div>';
    return;
  }

  const auth = { headers: { Authorization: 'Bearer ' + token } };
  const $ = (id) => document.getElementById(id);

  const state = {
    agents: new Map(),
    tasks: new Map(),
    events: [],
    eventTimes: [],
  };

  function colourFor(name) {
    if (!name) return '#71717a';
    let h = 0; for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360} 70% 60%)`;
  }
  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toTimeString().slice(0,8);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderAgents() {
    $('agent-count').textContent = state.agents.size;
    const ul = $('agents');
    ul.innerHTML = '';
    for (const a of [...state.agents.values()].sort((x,y) => x.name.localeCompare(y.name))) {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="swatch" style="background:${colourFor(a.name)}"></span>
        <span class="agent-name">${escapeHtml(a.name)}</span>
        <span class="role">${escapeHtml(a.role || '')}</span>
        <span class="status status-${a.status}">${a.status}</span>
        <span class="caps">${(a.capabilities || []).map(escapeHtml).join(', ')}</span>`;
      ul.appendChild(li);
    }
  }

  function renderTasks() {
    const bins = { open: [], claimed: [], done: [], failed: [], bidding: [] };
    for (const t of state.tasks.values()) (bins[t.status] || bins.open).push(t);
    bins.open.push(...bins.bidding);
    $('task-count').textContent = state.tasks.size;
    for (const k of ['open','claimed','done','failed']) {
      const ul = $('t-' + k);
      ul.innerHTML = '';
      for (const t of bins[k].sort((a,b)=>b.id-a.id)) {
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="tid">#${t.id}</span>
          <span class="ttitle">${escapeHtml(t.title)}</span>
          <span class="treq">${(t.requires || []).map(escapeHtml).join(' · ') || '—'}</span>
          ${t.claimed_by ? `<span class="tagent" style="color:${colourFor(t.claimed_by)}">→ ${escapeHtml(t.claimed_by)}</span>` : ''}
          ${t.lessons ? `<span class="tlesson" title="${escapeHtml(t.lessons)}">📓 lesson</span>` : ''}`;
        ul.appendChild(li);
      }
    }
  }

  function pushFeed(ev) {
    state.events.unshift(ev);
    state.events.length = Math.min(state.events.length, 200);
    state.eventTimes.push(Date.now());
    while (state.eventTimes.length && Date.now() - state.eventTimes[0] > 60_000) state.eventTimes.shift();
    $('feed-rate').textContent = state.eventTimes.length + '/min';
    $('metric-tax').textContent = 'tax ' + state.eventTimes.length + ' ev/min';
    const ol = $('feed');
    const li = document.createElement('li');
    const colour = colourFor(ev.agent_name);
    const perf = ev.performative ? `<span class="perf perf-${ev.performative}">${ev.performative}</span>` : '';
    const payload = ev.payload ? Object.entries(ev.payload).slice(0,2).map(([k,v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ') : '';
    li.innerHTML = `
      <span class="t">${fmtTime(ev.ts)}</span>
      <span class="dot" style="background:${colour}"></span>
      <span class="who">${escapeHtml(ev.agent_name || 'system')}</span>
      <span class="kind kind-${ev.kind}">${ev.kind}</span>
      ${perf}
      <span class="pl">${escapeHtml(payload).slice(0,160)}</span>`;
    ol.prepend(li);
    while (ol.children.length > 200) ol.removeChild(ol.lastChild);
  }

  async function loadInitial() {
    const r = await fetch(`/api/p/${proj}/state`, auth);
    if (!r.ok) {
      $('conn-pill').textContent = 'auth fail';
      $('conn-pill').classList.add('bad');
      return;
    }
    const data = await r.json();
    $('proj-name').textContent = data.project.name;
    $('mode-pill').textContent = `Mode ${data.project.alloc_mode} · ${modeLabel(data.project.alloc_mode)}`;
    state.agents = new Map(data.agents.map((a) => [a.name, a]));
    state.tasks = new Map(data.tasks.map((t) => [t.id, t]));
    renderAgents();
    renderTasks();
    for (const ev of [...data.events].reverse()) pushFeed(ev);
  }

  function modeLabel(m) {
    return ({ A:'Free-for-all', B:'Capability-matched', C:'Contract-net', D:'Reputation-weighted' }[m]) || m;
  }

  function attachStream() {
    const url = `/api/p/${proj}/stream?_=${encodeURIComponent(token)}`;
    // EventSource cannot send headers, so we sneak the token via a query for SSE only — but our server
    // requires the header. Workaround: open with fetch + ReadableStream parser.
    fetch(`/api/p/${proj}/stream`, { headers: { Authorization: 'Bearer ' + token } }).then(async (resp) => {
      if (!resp.ok || !resp.body) {
        $('conn-pill').textContent = 'stream fail';
        $('conn-pill').classList.add('bad');
        return;
      }
      $('conn-pill').textContent = 'live';
      $('conn-pill').classList.add('good');
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          handleFrame(frame);
        }
      }
      $('conn-pill').textContent = 'closed';
      $('conn-pill').classList.remove('good');
      setTimeout(attachStream, 2000);
    }).catch(() => setTimeout(attachStream, 2000));
  }

  function handleFrame(frame) {
    let event = 'message', data = '';
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    if (!data) return;
    let payload;
    try { payload = JSON.parse(data); } catch { return; }
    onEvent(event, payload);
  }

  function onEvent(name, p) {
    if (name === 'event') {
      pushFeed(p);
      // touch agent
      if (p.agent_name) {
        const cur = state.agents.get(p.agent_name) || { name: p.agent_name, role: '', capabilities: [], status: 'working' };
        cur.last_seen = p.ts;
        cur.status = 'working';
        state.agents.set(p.agent_name, cur);
        renderAgents();
      }
    } else if (name === 'task_post' || name === 'task_claim' || name === 'task_complete' || name === 'task_fail') {
      state.tasks.set(p.id, p);
      renderTasks();
    }
  }

  loadInitial().then(attachStream);
})();
</script>
</body>
</html>
